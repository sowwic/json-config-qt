site_name: json-config-qt Documentation
site_description: Documentation for json-config-qt.
site_author: Dima Shevchenko
theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search
  - mkdocs-autoapi:
      autoapi_dir: "src/json_config_qt"
      autoapi_ignore:
        - "**/version.py"
        
        - "**/hooks-pyside6.py"
        
        - "**/resources/*"
        - "**/main.py"
      autoapi_file_patterns:
        - "*.py"
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_signature: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true
  - autorefs

nav:
  - Home: index.md
  - User Guide:
      - user/index.md
      - Opening the dialog: user/dialog.md
      - Embedding the widget: user/widget.md
      - Editing layers: user/editing.md
  - Developer Guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - The tree: dev/tree.md
      - Testing: dev/testing.md
      - Releasing: dev/releasing.md
